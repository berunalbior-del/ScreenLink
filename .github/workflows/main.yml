name: Build ScreenLink
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate android folder
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "Found: $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
        working-directory: ${{ steps.loc.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate pc folder
        id: loc
        shell: pwsh
        run: |
          $d = (Get-ChildItem -Recurse -Filter server.py | Select-Object -First 1).DirectoryName
          Write-Host "Found: $d"
          "dir=$d" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName "${{ steps.loc.outputs.dir }}\ffmpeg.exe"
      - run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name ScreenLink --add-binary "ffmpeg.exe;." server.py
        working-directory: ${{ steps.loc.outputs.dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLink-exe
          path: ${{ steps.loc.outputs.dir }}/dist/ScreenLink.exe
